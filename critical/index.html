<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>El marqués de las Navas – Edición Digital Académica</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <script src="src/CETEI.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Sticky header with title and buttons -->
  <header id="sticky-header" class="page-header">
    <div class="header-title">
      <span><em>El marqués de las Navas</em> – Edición Digital Académica</span>
    </div>
    <div id="floating-tools">
      <button id="add-witness-btn" title="Comparar testimonio">+</button>
      <select id="witness-select" class="hidden">
        <option value="">Selecciona testimonio</option>
      </select>
      <button id="open-stats-btn">Ver estadísticas</button>
    </div>
  </header>

  <!-- TEI Content Wrapper -->
  <div id="tei-wrapper" class="synoptic-view">
    <div id="critical-container" class="tei-column critical-column"></div>
    <div id="witness-container" class="tei-column witness-column hidden"></div>
  </div>

  <!-- Modal wrapper for centering and backdrop -->
  <div id="modal-wrapper" class="modal hidden">
    <div id="stats-modal">
      <!-- Close button -->
      <button id="close-stats-btn">🗙</button>

      <!-- Witness selection -->
      <h3>Elige un testimonio</h3>
      <div class="witness-controls">
        <div id="witness-buttons"></div>
        <button id="toggle-global-chart-btn">Ver gráficas</button>
      </div>

      <!-- Stats panel (list + individual chart) -->
      <div id="stats-panel">
        <canvas id="stats-chart" width="800" height="300"></canvas>
      </div>

      <!-- Global charts (general + per-act) -->
      <div id="global-chart-modal" class="hidden">
        <button id="close-global-chart-btn">Cerrar</button>
        <h3>📊 Comparativa global entre testigos</h3>
        <div id="global-charts-container"></div>
      </div>
    </div>
  </div>


  <script>
    const CETEIcean = new CETEI();
    CETEIcean.addBehaviors({
      "tei": {
        "anchor": function(el) {
          const span = document.createElement("span");
          const xmlID = el.getAttribute("xml:id");
          if (xmlID) {
            span.setAttribute("data-xml-id", xmlID);
          }
          return span;
        }
      }
    });

    let originalData, baseTEI;

    const speakerAliasMap = {
      "1": "Luis",
      "2": "Juan",
      "Músico" : "Asián"
    };

    let castMap = {};

    function reconstructWitness(witID, originalData) {
      const clone = originalData.cloneNode(true);

      if (!clone.querySelector("tei-castList") && originalData.querySelector("tei-castList")) {
        const cast = originalData.querySelector("tei-castList").cloneNode(true);
        clone.insertBefore(cast, clone.firstChild);
      }

      clone.querySelectorAll("tei-app").forEach(app => {
        const from = app.getAttribute("from");
        const to = app.getAttribute("to");
        const appType = app.getAttribute("type");

        // Skip additions — handled in handleAdditionSpans()
        if (appType === "addition") return;

        // ===== 1. Long-span omission (with anchors) =====
        if (from && to) {
          const rdgs = Array.from(app.querySelectorAll("tei-rdg"));
          const omits = rdgs.filter(rdg =>
            (rdg.getAttribute("wit") || "").split(/\s+/).includes("#" + witID) &&
            rdg.textContent.trim() === ""
          );

          if (omits.length > 0) {
            const fromId = from.replace(/^#/, "");
            const toId = to.replace(/^#/, "");
            const startAnchor = clone.querySelector(`[data-xml-id="${fromId}"]`);
            const endAnchor = clone.querySelector(`[data-xml-id="${toId}"]`);

            if (startAnchor && endAnchor) {
              const allElements = Array.from(clone.querySelectorAll("*"));

              let inRange = false;
              const affectedElements = [];

              for (const el of allElements) {
                if (el === startAnchor) {
                  inRange = true;
                  continue;
                }
                if (el === endAnchor) break;

                const tag = el.tagName.toLowerCase();
                if (inRange && (tag === "tei-l" || tag === "tei-speaker")) {
                  affectedElements.push(el);
                }
              }

              affectedElements.forEach(el => {
                while (el.firstChild) {
                  el.removeChild(el.firstChild);
                }

                const placeholder = document.createElement("span");
                placeholder.className = "placeholder-block";
                placeholder.innerHTML = "[...........................................]";
                el.appendChild(placeholder);
              });
            }

            return;
          }
        }

        // ===== 2. Inline omission (tei-app without from/to) =====
        const rdgs = Array.from(app.querySelectorAll("tei-rdg"));
        const lemma = app.querySelector("tei-lem");

        const matchingRdg = rdgs.find(rdg => {
          const witList = (rdg.getAttribute("wit") || "")
            .split(/\s+/)
            .map(w => w.replace(/^#/, ""))
          return witList.includes(witID);
        });

        const isOmitted = matchingRdg && matchingRdg.textContent.trim() === "";

        if (isOmitted) {
          const parentL = app.closest("tei-l");
          if (parentL && parentL.textContent.trim() === app.textContent.trim()) {
            const replacement = document.createElement("span");
            replacement.className = "placeholder-block";
            replacement.innerHTML = "[...........................................]";
            app.parentNode.replaceChild(replacement, app);
          } else {
            const replacement = document.createElement("span");
            replacement.className = "witness-reading";
            replacement.textContent = "";
            app.parentNode.replaceChild(replacement, app);
          }
          return;
        }

        // ===== 3. Normal lemma or variant selection =====
        let chosenText = "";
        if (matchingRdg) {
          chosenText = matchingRdg.textContent.trim();
        } else if (lemma) {
          chosenText = lemma.textContent.trim();
        }

        const replacement = document.createElement("span");
        replacement.className = "witness-reading";
        replacement.textContent = chosenText;
        app.parentNode.replaceChild(replacement, app);
      });

      return clone;
    }

    function handleAdditionSpans(data, witID) {
      // Normalize the witness ID (remove # if present)
      witID = witID.replace(/^#/, "");

      const apps = data.querySelectorAll("tei-app[type='addition']");

      apps.forEach(app => {
        const from = app.getAttribute("from");
        const to = app.getAttribute("to");
        if (!from || !to) return;

        const fromId = from.replace(/^#/, "");
        const toId = to.replace(/^#/, "");
        const startAnchor = data.querySelector(`[data-xml-id="${fromId}"]`);
        const endAnchor = data.querySelector(`[data-xml-id="${toId}"]`);

        console.log("== Addition Span for Witness:", witID, "==");
        console.log("Start Anchor:", startAnchor);
        console.log("End Anchor:", endAnchor);

        if (!startAnchor || !endAnchor) {
          console.warn("⚠️ Anchors not found for addition span:", fromId, "→", toId);
          return;
        }

        // === Use TreeWalker to collect all elements between the anchors ===
        const affectedElements = [];
        const walker = document.createTreeWalker(
          data,
          NodeFilter.SHOW_ELEMENT,
          null,
          false
        );

        let inRange = false;
        let node;

        while ((node = walker.nextNode())) {
          if (node === startAnchor) {
            inRange = true;
            continue;
          }
          if (node === endAnchor) break;
          if (inRange) affectedElements.push(node);
        }

        console.log("Affected elements:", affectedElements.map(e => e.tagName));

        // === Find the matching <rdg> for this witness ===
        const rdgs = Array.from(app.querySelectorAll("tei-rdg"));
        const matchingRdg = rdgs.find(rdg =>
          (rdg.getAttribute("wit") || "")
            .split(/\s+/)
            .map(w => w.replace(/^#/, ""))
            .includes(witID)
        );

        const isAddition = !!matchingRdg && matchingRdg.innerHTML.includes("tei-add");


        console.log("Matching <rdg>:", matchingRdg?.outerHTML || "❌ None");
        console.log("Is addition for this witness?", isAddition);

        if (!isAddition) {
          // ❌ This witness does NOT include the addition — remove the span
          affectedElements.forEach(el => el.remove());
        } else {
          // ✅ This witness includes the addition — wrap it for styling
          const wrapper = document.createElement("div");
          wrapper.className = "witness-addition";
          if (affectedElements[0]) {
            affectedElements[0].parentNode.insertBefore(wrapper, affectedElements[0]);
            affectedElements.forEach(el => wrapper.appendChild(el));
          }
        }

        // Clean up <tei-app> from the DOM
        app.remove();
      });
    }


    function decorateNotes(data) {
      const notes = data.querySelectorAll("tei-note, note");
      notes.forEach(originalNote => {
        const content = originalNote.textContent.trim();
        const wrapper = document.createElement("span");
        wrapper.className = "tei-note";

        const icon = document.createElement("sup");
        icon.className = "note-icon";
        icon.textContent = "❋";

        const tooltip = document.createElement("div");
        tooltip.className = "note-tooltip";
        tooltip.textContent = content;

        wrapper.appendChild(icon);
        wrapper.appendChild(tooltip);
        originalNote.replaceWith(wrapper);
      });
    }

    function attachNoteEvents(container = document) {
      const notes = container.querySelectorAll(".tei-note");
      notes.forEach(note => {
        const icon = note.querySelector(".note-icon");
        icon.addEventListener("click", e => {
          e.stopPropagation();
          container.querySelectorAll(".tei-note.active").forEach(n => {
            if (n !== note) n.classList.remove("active");
          });
          note.classList.toggle("active");
        });
      });

      document.addEventListener("click", () => {
        container.querySelectorAll(".tei-note.active").forEach(n => n.classList.remove("active"));
      });
    }

    function insertLeftAlignedLineNumbers(data) {
      const lines = data.querySelectorAll("tei-l, l");
      lines.forEach(line => {
        const num = line.getAttribute("n");
        const part = line.getAttribute("part");

        const wrapper = document.createElement("div");
        wrapper.className = "line-container";

        const lineNum = document.createElement("span");
        lineNum.className = "line-number";

        if (num && (!part || part === "F") && parseInt(num) % 5 === 0) {
          lineNum.textContent = num;
        }

        const lineText = document.createElement("span");
        lineText.className = "line-text";

        while (line.firstChild) {
          lineText.appendChild(line.firstChild);
        }

        wrapper.appendChild(lineNum);
        wrapper.appendChild(lineText);
        line.appendChild(wrapper);
      });
    }

    function alignSplitVerses(data) {
      const lines = data.querySelectorAll("tei-l, l");
      lines.forEach((line, index) => {
        const part = line.getAttribute("part");
        const container = line.querySelector(".line-text");
        if (!part || !container) return;

        const prev = lines[index - 1];
        const prevPart = prev?.getAttribute("part");
        const prevLineText = prev?.querySelector(".line-text");

        if ((part === "M" && prevPart === "I") || (part === "F" && (prevPart === "M" || prevPart === "I"))) {
          if (prevLineText) {
            const indent = prevLineText.getBoundingClientRect().width;
            container.style.paddingLeft = `${indent}px`;
          }
        }
      });
    }

    function decorateApparatus(data) {
      const apps = data.querySelectorAll("tei-app:not([from])");
      apps.forEach(app => {
        const lemma = app.querySelector("tei-lem");
        const readings = Array.from(app.querySelectorAll("tei-rdg"));
        if (lemma) {
          const wrapper = document.createElement("span");
          wrapper.className = "lem-wrapper";
          wrapper.textContent = lemma.textContent.trim();

          const tooltip = document.createElement("div");
          tooltip.className = "apparatus-tooltip";

          readings.forEach(rdg => {
            const entry = document.createElement("div");
            entry.className = "apparatus-entry";

            const rdgSpan = document.createElement("span");
            rdgSpan.textContent = rdg.textContent.trim() || "om.";

            const witSpan = document.createElement("span");
            witSpan.className = "witness-label";
            witSpan.textContent = rdg.getAttribute("wit") || "";

            entry.appendChild(rdgSpan);
            entry.appendChild(witSpan);
            tooltip.appendChild(entry);
          });

          wrapper.appendChild(tooltip);

          wrapper.addEventListener("click", e => {
            e.stopPropagation();
            data.querySelectorAll(".lem-wrapper.active").forEach(el => {
              if (el !== wrapper) el.classList.remove("active");
            });
            wrapper.classList.toggle("active");
          });

          document.addEventListener("click", () => wrapper.classList.remove("active"));

          app.parentNode.replaceChild(wrapper, app);
        }
      });
    }

  function decorateOmissionSpans(data, inWitnessView = false) {
    const apps = data.querySelectorAll("tei-app[from][to]");

    apps.forEach(app => {
      const fromId = app.getAttribute("from")?.replace(/^#/, "");
      const toId = app.getAttribute("to")?.replace(/^#/, "");
      const rdgs = Array.from(app.querySelectorAll("tei-rdg"));
      const omittedWits = rdgs
        .filter(rdg => rdg.textContent.trim() === "")
        .map(rdg => rdg.getAttribute("wit")?.replace(/^#/, ""));

      if (!fromId || !toId || omittedWits.length === 0) return;

      const startAnchor = data.querySelector(`[data-xml-id="${fromId}"]`);
      const endAnchor = data.querySelector(`[data-xml-id="${toId}"]`);
      if (!startAnchor || !endAnchor) return;

      const wrapper = document.createElement("div");
      wrapper.className = "lem-wrapper omission-block";


      const tooltip = document.createElement("div");
      tooltip.className = "apparatus-tooltip";
      tooltip.textContent = `Texto omitido en: #${omittedWits.join(", ")}`;
      wrapper.appendChild(tooltip);

      wrapper.addEventListener("click", e => {
        e.stopPropagation();
        data.querySelectorAll(".lem-wrapper.active").forEach(el => {
          if (el !== wrapper) el.classList.remove("active");
        });
        wrapper.classList.toggle("active");
      });

      document.addEventListener("click", () => {
        wrapper.classList.remove("active");
      });

      const walker = document.createTreeWalker(
        data,
        NodeFilter.SHOW_ELEMENT,
        null,
        false
      );

      let inside = false;
      const nodesToWrap = [];

      while (walker.nextNode()) {
        const node = walker.currentNode;

        if (node === startAnchor) {
          inside = true;
          continue;
        }

        if (node === endAnchor) {
          break;
        }

        if (inside) {
          nodesToWrap.push(node);
        }
      }

      if (nodesToWrap.length === 0) return;

      const firstNode = nodesToWrap[0];
      const parent = firstNode.parentNode;
      parent.insertBefore(wrapper, firstNode);

      nodesToWrap.forEach(node => wrapper.appendChild(node));

      app.remove(); // Clean up <tei-app>
    });
  }

    function decorateAdditionSpans(data) {
      const apps = data.querySelectorAll("tei-app[type='addition']");

      apps.forEach(app => {
        const from = app.getAttribute("from");
        const to = app.getAttribute("to");
        if (!from || !to) return;

        const fromId = from.replace(/^#/, "");
        const toId = to.replace(/^#/, "");
        const startAnchor = data.querySelector(`[data-xml-id="${fromId}"]`);
        const endAnchor = data.querySelector(`[data-xml-id="${toId}"]`);
        if (!startAnchor || !endAnchor) return;

        // Get list of witnesses from <rdg>
        const rdgs = Array.from(app.querySelectorAll("tei-rdg"));
        const witList = rdgs
          .map(rdg => (rdg.getAttribute("wit") || "")
          .split(/\s+/)
          .map(w => w.replace(/^#/, "")))
          .flat();

        // Remove content between anchors from base text
        const walker = document.createTreeWalker(data, NodeFilter.SHOW_ELEMENT, null, false);
        let inRange = false;
        let node;
        const affectedElements = [];

        while ((node = walker.nextNode())) {
          if (node === startAnchor) {
            inRange = true;
            continue;
          }
          if (node === endAnchor) break;
          if (inRange) affectedElements.push(node);
        }

        affectedElements.forEach(el => el.remove());

        // === Add the custom tooltip icon ===
        const wrapper = document.createElement("span");
        wrapper.className = "addition-marker-wrapper";

        const marker = document.createElement("span");
        marker.className = "addition-marker";
        marker.textContent = "✚";

        const tooltip = document.createElement("span");
        tooltip.className = "addition-tooltip";
        tooltip.textContent = `Se añade un pasaje en: #${witList.join(", ")}`;

        wrapper.appendChild(marker);
        wrapper.appendChild(tooltip);

        // Insert marker after the anchor
        startAnchor?.parentNode?.insertBefore(wrapper, startAnchor.nextSibling);

        app.remove(); // Clean up
      });
    }

    function enableLineSyncHighlighting() {
      document.querySelectorAll("[data-line-n]").forEach(el => {
        el.addEventListener("mouseenter", () => {
          const n = el.getAttribute("data-line-n");
          document.querySelectorAll(`[data-line-n="${n}"]`).forEach(matchingEl => {
            matchingEl.classList.add("line-highlight");
          });
        });

        el.addEventListener("mouseleave", () => {
          const n = el.getAttribute("data-line-n");
          document.querySelectorAll(`[data-line-n="${n}"]`).forEach(matchingEl => {
            matchingEl.classList.remove("line-highlight");
          });
        });
      });
    }

    function calculateLineStats(container, witID, castMap) {
      const stats = {};

      container.querySelectorAll("tei-sp").forEach(sp => {
        let speakerName = "";

        const speakerEl = sp.querySelector("tei-speaker");
        if (speakerEl) {
          const appEl = speakerEl.querySelector("tei-app");

          if (appEl) {
            const matchingRdg = appEl.querySelector(`tei-rdg[wit~="#${witID}"]`);
            if (matchingRdg) {
              speakerName = matchingRdg.textContent.trim();
            } else {
              const lemEl = appEl.querySelector("tei-lem");
              if (lemEl) speakerName = lemEl.textContent.trim();
            }
          } else {
            speakerName = speakerEl.textContent.trim();
          }
        }

        // ❌ Skip ghost speakers like [..........]
        if (/^\[\.+\]$/.test(speakerName)) return;

        // ✅ Normalize name
        const normalizedID =
          Object.keys(castMap).find(id => castMap[id] === speakerName) ||
          speakerAliasMap[speakerName] ||
          speakerName;

        let countedLines = 0;

        sp.querySelectorAll("tei-l").forEach(line => {
          const text = line.textContent.trim();

          // ❌ Skip empty or elided lines like [.........]
          if (!/^\[\.+\]$/.test(text)) {
            countedLines++;
          }
        });

        if (countedLines > 0) {
          if (!stats[normalizedID]) stats[normalizedID] = 0;
          stats[normalizedID] += countedLines;
        }
      });

      return stats;
    }


    let chartInstance = null; // global chart instance for re-use

    function renderStatsPanel(stats, witID, castMap) {
      const panel = document.getElementById("stats-panel");
      const chartCanvas = document.getElementById("stats-chart");

      panel.innerHTML = "";

      if (!stats || Object.keys(stats).length === 0) {
        panel.innerHTML = `<h3>Sin líneas para ${witID}</h3>`;
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }
        return;
      }

      // ✅ Render table version of stats
      panel.innerHTML = `
        <h3>Estadísticas para testimonio #${witID}:</h3>
        <table class="stats-table">
          <thead>
            <tr>
              <th style="font-variant: small-caps;">Personaje</th>
              <th style="font-variant: small-caps;">Cantidad de líneas</th>
            </tr>
          </thead>
          <tbody>
            ${Object.entries(stats).map(([charID, count]) => {
              const name = castMap[charID] || charID;
              return `<tr><td><strong>${name}</strong></td><td>${count}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
      `;

      // ✅ Re-render chart
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(chartCanvas, {
        type: 'bar',
        data: {
          labels: Object.keys(stats).map(id => castMap[id] || id),
          datasets: [{
            label: `Líneas habladas en ${witID}`,
            data: Object.values(stats),
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.parsed.y} línea(s)`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Cantidad de líneas'
              }
            },
            x: {
              ticks: {
                autoSkip: false,
                maxRotation: 60,
                minRotation: 30
              }
            }
          }
        }
      });
    }

    function extractWitnessSigla(data) {
      const siglaSet = new Set();

      data.querySelectorAll("tei-rdg[wit], tei-lem[wit]").forEach(rdg => {
        const witAttr = rdg.getAttribute("wit");
        if (!witAttr) return;

        witAttr.split(/\s+/).forEach(wit => {
          siglaSet.add(wit.replace(/^#/, ""));
        });
      });

      return Array.from(siglaSet).sort(); // returns ["M", "P", "T", ...]
    }

    function buildCastMap(data) {
      const map = {};
      data.querySelectorAll("tei-castItem").forEach(item => {
        const id = item.getAttribute("xml:id");
        const name = item.textContent.trim();
        if (id && name) map[id] = name;
      });
      return map;
    }

    function calculateGlobalStats(allWitnesses, baseTEI, castMap) {
      const globalStats = {}; // { "Character": { "M": 10, "P": 8, ... } }

      allWitnesses.forEach(witID => {
        const witnessDOM = reconstructWitness(witID, baseTEI);
        const localStats = calculateLineStats(witnessDOM, witID, castMap);

        Object.entries(localStats).forEach(([char, count]) => {
          if (!globalStats[char]) globalStats[char] = {};
          globalStats[char][witID] = count;
        });
      });

      return globalStats;
    }

    function calculateActStatsPerWitness(baseTEI, allWitnesses, castMap) {
      const actDivs = Array.from(baseTEI.querySelectorAll('tei-div[type="act"]'));
      const allStats = {}; // { actN: { witnessID: { speakerID: count } } }

      actDivs.forEach((actDiv, idx) => {
        const actKey = `Acto ${idx + 1}`;
        allStats[actKey] = {};

        allWitnesses.forEach(witID => {
          const reconstructed = reconstructWitness(witID, actDiv.cloneNode(true));
          const stats = calculateLineStats(reconstructed, witID, castMap);
          allStats[actKey][witID] = stats;
        });
      });

      return allStats;
    }

    function renderGlobalStatsChart(globalStats, allWitnesses, castMap, canvas, title = "Comparación") {
      if (!(canvas instanceof HTMLCanvasElement)) {
        console.error("❌ Invalid canvas passed to renderGlobalStatsChart", canvas);
        return;
      }

      const characterLabels = Object.keys(globalStats).map(id => castMap[id] || id);

      const datasets = allWitnesses.map((witID, idx) => ({
        label: witID,
        data: characterLabels.map(label => {
          const internalID = Object.keys(castMap).find(k => castMap[k] === label) || label;
          return globalStats[internalID]?.[witID] || 0;
        }),
        backgroundColor: `hsl(${(idx * 360) / allWitnesses.length}, 70%, 60%)`
      }));

      new Chart(canvas, {
        type: 'bar',
        data: {
          labels: characterLabels,
          datasets: datasets
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: title
            },
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.raw} línea(s)`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: 'Cantidad de líneas'
              }
            },
            x: {
              ticks: {
                autoSkip: false
              }
            }
          }
        }
      });
    }

    function attachGlobalChartToggle() {
      const toggleBtn = document.getElementById("toggle-global-chart-btn");
      const globalChartModal = document.getElementById("global-chart-modal");

      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          globalChartModal.classList.toggle("hidden");
          if (!globalChartModal.classList.contains("hidden")) {
            globalChartModal.scrollIntoView({ behavior: "smooth" });
          }
        });
      }
    }

    function renderGlobalCharts(globalChartContainer, allWitnesses, castMap) {
      globalChartContainer.innerHTML = "";

      const globalStats = calculateGlobalStats(allWitnesses, baseTEI, castMap);

      // Overall chart
      const overallWrapper = document.createElement("div");
      overallWrapper.classList.add("resizable-chart");
    

      const overallCanvas = document.createElement("canvas");
      overallWrapper.appendChild(overallCanvas);
      globalChartContainer.appendChild(overallWrapper);

      const overallChart = new Chart(overallCanvas, {
        type: "bar",
        data: formatDataForChart(globalStats, allWitnesses, castMap),
        options: {
          responsive: false,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: "Comparación general de líneas"
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });

      const overallObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
          const rect = entry.contentRect;
          overallCanvas.width = rect.width;
          overallCanvas.height = rect.height;
          overallChart.resize();
        }
      });
      overallObserver.observe(overallWrapper);

      // Per-act charts
      const actStats = calculateActStatsPerWitness(baseTEI, allWitnesses, castMap);

      Object.entries(actStats).forEach(([actName, witData]) => {
        const actTitle = document.createElement("h4");
        actTitle.textContent = `${actName}`;
        globalChartContainer.appendChild(actTitle);

        const actWrapper = document.createElement("div");
        actWrapper.classList.add("resizable-chart");
        actWrapper.style.width = "800px";
        actWrapper.style.height = "300px";

        const actCanvas = document.createElement("canvas");
        actWrapper.appendChild(actCanvas);
        globalChartContainer.appendChild(actWrapper);

        const actGlobalStats = {};
        Object.entries(witData).forEach(([witID, speakerCounts]) => {
          Object.entries(speakerCounts).forEach(([charID, count]) => {
            if (!actGlobalStats[charID]) actGlobalStats[charID] = {};
            actGlobalStats[charID][witID] = count;
          });
        });

        const actChart = new Chart(actCanvas, {
          type: "bar",
          data: formatDataForChart(actGlobalStats, allWitnesses, castMap),
          options: {
            responsive: false,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: true,
                text: `Líneas por personaje – ${actName}`
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

        const actObserver = new ResizeObserver(entries => {
          for (let entry of entries) {
            const rect = entry.contentRect;
            actCanvas.width = rect.width;
            actCanvas.height = rect.height;
            actChart.resize();
          }
        });
        actObserver.observe(actWrapper);
      });

      globalChartContainer.dataset.rendered = "true";
    }

    function setupStatsPopup(allWitnesses, castMap) {
      const openBtn = document.getElementById("open-stats-btn");
      const closeBtn = document.getElementById("close-stats-btn");
      const modalWrapper = document.getElementById("modal-wrapper");
      const witnessButtons = document.getElementById("witness-buttons");
      const statsPanel = document.getElementById("stats-panel");
      const globalChartContainer = document.getElementById("global-chart-modal");

      openBtn.addEventListener("click", () => {
        modalWrapper.classList.remove("hidden");
        statsPanel.innerHTML = "";
        globalChartContainer.innerHTML = ""; // Clean all charts

        const globalStats = calculateGlobalStats(allWitnesses, baseTEI, castMap);

        // Overall chart
        const overallCanvas = document.createElement("canvas");
        overallCanvas.width = 800;
        overallCanvas.height = 300;
        globalChartContainer.appendChild(overallCanvas);
        renderGlobalStatsChart(globalStats, allWitnesses, castMap, overallCanvas, "Comparación general de líneas");

        // Per act
        const actStats = calculateActStatsPerWitness(baseTEI, allWitnesses, castMap);

        Object.entries(actStats).forEach(([actName, witData]) => {
          const actTitle = document.createElement("h4");
          actTitle.textContent = `${actName}`;
          globalChartContainer.appendChild(actTitle);

          const actCanvas = document.createElement("canvas");
          actCanvas.width = 800;
          actCanvas.height = 300;
          globalChartContainer.appendChild(actCanvas);

          const actGlobalStats = {};
          Object.entries(witData).forEach(([witID, speakerCounts]) => {
            Object.entries(speakerCounts).forEach(([charID, count]) => {
              if (!actGlobalStats[charID]) actGlobalStats[charID] = {};
              actGlobalStats[charID][witID] = count;
            });
          });

          renderGlobalStatsChart(actGlobalStats, allWitnesses, castMap, actCanvas, `Líneas por personaje – ${actName}`);
        });
      });

      closeBtn.addEventListener("click", () => {
        modalWrapper.classList.add("hidden");
        statsPanel.innerHTML = "";
        globalChartContainer.innerHTML = "";
      });

      witnessButtons.innerHTML = "";
      allWitnesses.forEach(witID => {
        const btn = document.createElement("button");
        btn.textContent = witID;
        btn.classList.add("witness-btn");

        btn.addEventListener("click", () => {
          const witnessDOM = reconstructWitness(witID, baseTEI);
          const stats = calculateLineStats(witnessDOM, witID, castMap);
          renderStatsPanel(stats, witID, castMap);

          // 👇 Always hide the global chart section
          const globalChartModal = document.getElementById("global-chart-modal");
          globalChartModal.classList.add("hidden");

          document.getElementById("stats-panel").scrollIntoView({ behavior: "smooth" });
        });

        // ✅ THIS WAS MISSING
        witnessButtons.appendChild(btn);
      });
    }

    function setupFloatingControls() {
      const btn = document.getElementById("add-witness-btn");
      const select = document.getElementById("witness-select");

      btn.addEventListener("click", () => {
        select.classList.toggle("visible");
      });

      select.addEventListener("change", () => {
        const witnessID = select.value;
        if (!witnessID) return;

        const container = document.getElementById("witness-container");
        container.innerHTML = "";
        container.classList.remove("hidden");

        const witnessDOM = reconstructWitness(witnessID, baseTEI);
        container.appendChild(witnessDOM);
        witnessDOM.setAttribute("data-witness-id", witnessID);

        requestAnimationFrame(() => {
          decorateNotes(witnessDOM);
          decorateApparatus(witnessDOM);
          insertLeftAlignedLineNumbers(witnessDOM);
          alignSplitVerses(witnessDOM);
          decorateOmissionSpans(witnessDOM);
          handleAdditionSpans(witnessDOM, witnessID);

          // ✅ ADD THIS: Annotate witness lines
          witnessDOM.querySelectorAll("tei-l[n]").forEach(line => {
            const n = line.getAttribute("n");
            if (n) {
              line.classList.add(`line-n-${n}`);
              line.setAttribute("data-line-n", n);
            }
          });

          // ✅ Enable synced highlighting after DOM is ready
          enableLineSyncHighlighting();
        });
      });
    }

    function populateWitnessSelect(allWitnesses) {
      const select = document.getElementById("witness-select");

      // Clear existing options except the first
      select.innerHTML = '<option value="">Selecciona testimonio</option>';

        allWitnesses.forEach(witID => {
          const option = document.createElement("option");
          option.value = witID;
          option.textContent = witID;
          select.appendChild(option);
      });
    }

    window.onload = function () {
      CETEIcean.getHTML5("el_marques.xml", function (data) {
        baseTEI = data.cloneNode(true);
        originalData = data;

        const criticalContainer = document.getElementById("critical-container");
        criticalContainer.appendChild(data);

        const castMap = buildCastMap(baseTEI);
        const allSigla = extractWitnessSigla(originalData);
        populateWitnessSelect(allSigla); 
        setupStatsPopup(allSigla, castMap);

        requestAnimationFrame(() => {
          decorateNotes(data);
          decorateApparatus(data);
          insertLeftAlignedLineNumbers(data);
          alignSplitVerses(data);
          decorateOmissionSpans(data);
          attachNoteEvents(data);
          decorateAdditionSpans(data);
          attachGlobalChartToggle();

          document.querySelectorAll("tei-l[n]").forEach(line => {
            const n = line.getAttribute("n");
            if (n) {
              line.classList.add(`line-n-${n}`);
              line.setAttribute("data-line-n", n);
            }
          });

          enableLineSyncHighlighting();
        });

        setupFloatingControls();
      });
    };
  </script>
</body>
