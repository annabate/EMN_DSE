<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualizzazione TEI</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/annabate/EMN_DSE/refs/heads/gh-pages/css/tei.css">
  <script src="https://raw.githubusercontent.com/annabate/EMN_DSE/refs/heads/gh-pages/js/CETEI.js"></script>
  <style>
    .hidden { display: none; }
    .zoomed { transform: scale(2); z-index: 1000; position: relative; }
    /* Added styles for notes panel */
    .note-item { position: relative; border: 1px solid #ccc; margin: 0.5em 0; padding: 0.5em; padding-right: 2em; background: #fff; }
    .close-note { position: absolute; top: 5px; right: 5px; cursor: pointer; font-weight: bold; }
    #close-all-notes { cursor: pointer; font-size: 1.2em; }
  </style>
</head>
<body>

  <div id="view-selector">
    <button onclick="toggleView('facsimile-container')">Facsímil</button>
    <button onclick="toggleView('diplomatic-container')">Diplomática</button>
    <button onclick="toggleView('modern-container')">Modernizada</button>
  </div>

  <div id="page-jump">
    <label for="pb-selector">Ir a folio:</label>
    <select id="pb-selector"></select>
  </div>  

  <div id="tei-wrapper" class="synoptic-view">
    <div id="facsimile-container" class="tei-column sticky"> 
    <div id="folio-controls">
      <button id="prev-folio">←</button>
      <button id="next-folio">→</button>
    </div> 
      <div id="facsimile-wrapper"><img id="facsimile-image" src="" alt="Facsímil" />    
  </div>
</div>
    <div id="diplomatic-container" class="tei-column"></div>
    <div id="modern-container" class="tei-column"></div>
    <div id="note-container" class="tei-column hidden">
      <div id="close-all-notes-container" style="text-align: right;">
        <span id="close-all-notes" style="cursor: pointer; font-size: 1.2em;">❌</span>
      </div>
    </div>
  </div>  

  

  <script>
    function toggleView(id) {
      const element = document.getElementById(id);
      element.classList.toggle("hidden");
    }

    function decorateNotes(data) {
      const notes = data.querySelectorAll("tei-note");
      console.log("NOTE TROVATE:", notes.length);

      notes.forEach(originalNote => {
        const type = originalNote.getAttribute("type");
        const subtype = originalNote.getAttribute("subtype");

        // ✂️ Rimuove i contenuti generati da CETEIcean
        const content = originalNote.cloneNode(true).textContent.trim();

        // ✅ Crea un nuovo nodo <tei-note> pulito
        const cleanNote = document.createElement("tei-note");
        if (type) cleanNote.setAttribute("type", type);
        if (subtype) cleanNote.setAttribute("subtype", subtype);
        cleanNote.setAttribute("data-note", content);

        const span = document.createElement("span");
        span.className = "note-icon";
        span.textContent = subtype || (type === "aparato" ? "Ap" : ""); // oppure ""
        if (subtype) span.setAttribute("data-subtype", subtype);

        cleanNote.appendChild(span);

        // 🔁 Sostituisce l'intero nodo con quello nuovo
        originalNote.replaceWith(cleanNote);
      });
    }

    const CETEIcean = new CETEI();

    function attachNoteEvents(container = document) {
      const notes = container.querySelectorAll("tei-note");
      // Attach click events to each note
      notes.forEach(note => {
        const content = note.getAttribute("data-note");
        note.addEventListener("click", (e) => {
          e.stopPropagation();
          const noteContainer = document.getElementById("note-container");
          noteContainer.classList.remove("hidden");
          const noteItem = document.createElement("div");
          noteItem.className = "note-item";
          noteItem.textContent = content;
          const closeBtn = document.createElement("span");
          closeBtn.className = "close-note";
          closeBtn.textContent = "❌";
          closeBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            noteItem.remove();
            if (!noteContainer.querySelector(".note-item")) {
              noteContainer.classList.add("hidden");
            }
          });
          noteItem.appendChild(closeBtn);
          noteContainer.appendChild(noteItem);
        });
      });
    }

    window.onload = function () {
      CETEIcean.getHTML5("amor_pleyto_y_desafio_diplomatic.xml", function (data) {
        decorateNotes(data);
        attachNoteEvents(data);

        // Correggi posizione dei <tei-pb>
        data.querySelectorAll("tei-l").forEach(verse => {
          const prev = verse.previousElementSibling;
          if (prev && prev.tagName === "TEI-PB") verse.parentNode.insertBefore(prev, verse);
        });

        const selector = document.getElementById("pb-selector");
        const pbElements = data.querySelectorAll("tei-pb");

        pbElements.forEach((pb, i) => {
          const id = pb.getAttribute("xml:id") || `pb-${i + 1}`;
          const n = pb.getAttribute("n") || `Pagina ${i + 1}`;
          const facsName = n
            .replace(/\[|\]/g, "")     // rimuove parentesi quadre
            .replace(/Fol\.?\s*/i, "fol") // sostituisce "Fol. ", "Fol ", o "Fol." con "fol"
            .replace(/\s/g, "")        // rimuove eventuali spazi residui
            .toLowerCase();            // minuscolo finale
          pb.setAttribute("id", id);
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = n;
          opt.dataset.facs = facsName;
          selector.appendChild(opt);
        });

        selector.addEventListener("change", e => {
          const option = e.target.selectedOptions[0];
          const facs = option.dataset.facs;
          const id = option.value;
          const target = document.getElementById(id);
          if (target) {
            const yOffset = -60; // puoi aumentare/diminuire per regolare la posizione
            const y = target.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({ top: y, behavior: "smooth" });
          }
          const img = document.getElementById("facsimile-image");
          img.src = "facs/" + facs + ".jpg";
          img.onerror = () => {
            img.src = "facs/placeholder.jpg";
          };
        });

        document.getElementById("prev-folio").addEventListener("click", () => {
          const selector = document.getElementById("pb-selector");
          if (selector.selectedIndex > 0) {
            selector.selectedIndex--;
            selector.dispatchEvent(new Event("change"));
          }
        });

        document.getElementById("next-folio").addEventListener("click", () => {
          const selector = document.getElementById("pb-selector");
          if (selector.selectedIndex < selector.options.length - 1) {
            selector.selectedIndex++;
            selector.dispatchEvent(new Event("change"));
          }
        });

        // Carica subito la prima immagine alla selezione iniziale
        const firstOption = selector.options[0];
        if (firstOption) {
          const facs = firstOption.dataset.facs;
          const id = firstOption.value;
          const img = document.getElementById("facsimile-image");
          img.src = "facs/" + facs + ".jpg";
          img.onerror = () => {
            img.src = "facs/placeholder.jpg";
          };
        }

        document.getElementById("diplomatic-container").appendChild(data);
      });

      CETEIcean.getHTML5("amor_pleito_y_desafío_modern.xml", function (data) {
        document.getElementById("modern-container").appendChild(data);
        decorateNotes(data);
        attachNoteEvents(data);
      });

      // Zoom dinamico + DRAG sull'immagine
      // Zoom + drag dinamico sull'immagine
      const img = document.getElementById("facsimile-image");
      const wrapper = document.getElementById("facsimile-wrapper");

      let isZoomed = false;
      let isDragging = false, startX, startY, currentX = 0, currentY = 0;

      img.addEventListener("click", (e) => {
        isZoomed = !isZoomed;
        if (!isZoomed) {
          currentX = 0;
          currentY = 0;
          img.style.transform = "translate(0px, 0px) scale(1)";
          wrapper.style.cursor = "grab";
        } else {
          img.style.transform = "translate(0px, 0px) scale(2.5)";
          wrapper.style.cursor = "grab";
        }
      });

      wrapper.addEventListener("mousedown", (e) => {
        if (!isZoomed) return;
        isDragging = true;
        startX = e.clientX - currentX;
        startY = e.clientY - currentY;
        wrapper.style.cursor = "grabbing";
      });

      document.addEventListener("mousemove", (e) => {
        if (!isZoomed || !isDragging) return;
        currentX = e.clientX - startX;
        currentY = e.clientY - startY;
        img.style.transform = `translate(${currentX}px, ${currentY}px) scale(2.5)`;
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
        if (isZoomed) {
          wrapper.style.cursor = "grab";
        }
      });

      // Event to close all notes
      document.getElementById("close-all-notes").addEventListener("click", () => {
        const noteContainer = document.getElementById("note-container");
        noteContainer.querySelectorAll(".note-item").forEach(item => item.remove());
        noteContainer.classList.add("hidden");
      });
    };
  </script>
</body>
</html>
