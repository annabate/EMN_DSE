<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El marqués de las Navas - edición genética digital</title>
  <link rel="stylesheet" href="../css/tei.css" />
  <script src="../js/CETEI.js"></script>
  <style>
    .hidden { display: none; }
    .zoomed { transform: scale(2); z-index: 1000; position: relative; }
    .note-item { position: relative; border: 1px solid #ccc; margin: 0.5em 0; padding: 0.5em; padding-right: 2em; background: #fff; }
  </style>
</head>
<body>

  <!-- ✅ CLEAN HEADER -->
  <header id="main-header">
  <div class="header-title">
    <h1><i>El marqués de las Navas</i> – Edición Genética Digital</h1>
  </div>

  <div id="toolbar">
    <div class="toolbar-group">
      <label for="pb-selector" style="font-size: 1rem; font-weight: bold;">Folio:</label>
      <select id="pb-selector"></select>
      <button id="prev-folio">🢦</button>
      <button id="next-folio">🢧</button>
    </div>

    <div class="toolbar-group">
      <button onclick="toggleView('facsimile-container')" style="font-size: 1rem;" title="Abrir/Cerrar">Facsímil</button>
      <button onclick="toggleView('modern-container')" style="font-size: 1rem;" title="Abrir/Cerrar">Edición genética</button>
      <button onclick="toggleView('diplomatic-container')" style="font-size: 1rem;">Transcripción</button>
    </div>

    <div class="toolbar-group" title="Ajustar fuente de texto">
      <button onclick="adjustFontSize(-1)" title="Reducir fuente">A−</button>
      <button onclick="adjustFontSize(1)" title="Aumentar fuente">A+</button>
    </div>

    <div class="toolbar-group">
      <label for="variant-selector" style="font-size: 1rem; font-weight: bold;">Filtrar intervenciones por tipología:</label>
      <select id="variant-selector">
        <option value="all">Mostrar todas</option>
        <option value="A0">A0 (original)</option>
        <option value="A1">A1 (correcciones inmediatas)</option>
        <option value="A2">A2 (revisión posterior)</option>
        <option value="B">B (mano ajena)</option>
      </select>
      <button id="clean-text-button">Texto limpio</button>
    </div>
  </div>
  <div class="toolbar-group-search" style="margin-left: auto;">
  <input type="text" id="search-input" placeholder="Buscar en el texto..." />
  <button id="search-button" title="Buscar">🔍</button>
  <button id="prev-match" title="Coincidencia anterior">⬆</button>
  <button id="next-match" title="Coincidencia siguiente">⬇</button>
</div>
</header>

  <!-- ✅ CORRECT WRAPPER -->
  <div id="tei-wrapper" class="synoptic-view">
    <div id="facsimile-container" class="tei-column sticky">
      <div id="facsimile-wrapper">
        <img id="facsimile-image" src="" alt="Facsímil" />
      </div>
    </div>

    <div id="modern-container" class="tei-column">
      <!-- TEI Modern XML will be appended here -->
      <div class="tei-column-scroll">
       <!-- Content inserted here -->
      </div>
    </div>

    <div id="diplomatic-container" class="tei-column">
      <!-- TEI Diplomatic XML will be appended here -->  
      <div class="tei-column-scroll">
        <!-- Content inserted here -->
      </div>
    </div>
  </div>

  <footer id="site-footer">
    <div class="footer-text">
      <p>
        Vega, Lope de, <i>El marqués de las Navas: edición genética digital</i>.
        Anna Abate, Università di Trento, Trento, 2025.
    </div>
    <div class="logos">
					<p class="credit_links">
					<a href="https://www.unitn.it/it"><img src="../logo/logoUnitn.jpg" class="logo" id="unitn"></a>
				</p></div>
		</footer>
  </footer>
 
<script>
  const CETEIcean = new CETEI();

  CETEIcean.addBehaviors({
    "tei": {
      "rdg": variantHandler,
      "lem": variantHandler
    }
  });

  let currentFontSize = 100; // % base

  function adjustFontSize(change) {
    currentFontSize = Math.max(60, Math.min(160, currentFontSize + change * 10)); // limits between 60% and 160%
    document.documentElement.style.setProperty('--user-font-size', `${currentFontSize}%`);
  }


  function variantHandler(el) {
    let span = document.createElement("span");
    span.innerHTML = el.innerHTML;
    span.setAttribute("varSeq", el.getAttribute("varSeq") || "");
    span.setAttribute("wit", el.getAttribute("wit") || "LEM"); // Or keep it empty or "lem"
    span.setAttribute("hand", el.getAttribute("hand") || "");
    span.dataset.originalHtml = el.innerHTML;
    return span;
  }

  function getMaxSeq() {
    let max = -1;
    const allVariants = document.querySelectorAll("tei-rdg[data-authorial='true'], tei-lem[data-authorial='true']");
    allVariants.forEach(rdg => {
      const seq = parseInt(rdg.getAttribute("varSeq"), 10);
      if (!isNaN(seq) && seq > max) max = seq;
    });
    return max;
  }

  const variantSelector = document.getElementById("variant-selector");
  let lastWit = null;

  if (variantSelector) {
    variantSelector.value = "all";
    filterReadings({ showAll: true });
  }

  function toggleView(id) {
    const element = document.getElementById(id);
    element.classList.toggle("hidden");
    updateLayoutClasses();
  }

  function decorateNotes(data) {
    const notes = data.querySelectorAll("tei-note");
    notes.forEach(originalNote => {
      const content = originalNote.cloneNode(true).textContent.trim();
      const cleanNote = document.createElement("tei-note");
      cleanNote.setAttribute("data-note", content);
      cleanNote.classList.add("note-decorated");

      const span = document.createElement("span");
      span.className = "note-icon";
      span.textContent = "*"; //
      span.style.fontWeight = "bold";
      span.style.fontSize = "1.2em";
      span.style.color = "#FF0000";
      span.style.cursor = "pointer";

      cleanNote.appendChild(span);
      originalNote.replaceWith(cleanNote);
    });
  }


 function attachNoteEvents(container = document) {
    const notes = container.querySelectorAll("tei-note");
    notes.forEach(note => {
      const content = note.getAttribute("data-note");

      note.addEventListener("click", (e) => {
        e.stopPropagation();

        // Remove existing floating notes
        document.querySelectorAll(".floating-note").forEach(n => n.remove());

        const rect = e.target.getBoundingClientRect();
        const floating = document.createElement("div");
        floating.className = "floating-note";
        floating.innerHTML = `
        <div style="position: relative; padding-right: 1.2em;">
          <button class="close-note" style="
            position: absolute;
            top: 0.1em;
            right: 0.1em;
            border: none;
            background: none;
            font-size: 0.8em;
            cursor: pointer;
            color: #444;"> ✖</button>
          <div style="padding-top: 1.1em;">${content}</div>
        </div>`;

        document.body.appendChild(floating);
        floating.style.left = `${rect.right + 10 + window.scrollX}px`;
        floating.style.top = `${rect.top + window.scrollY}px`;

        floating.querySelector(".close-note").addEventListener("click", () => {
          floating.remove();
        });

      });
    });

    // Close floating note on click elsewhere
    document.addEventListener("click", () => {
      document.querySelectorAll(".floating-note").forEach(n => n.remove());
    });
  }


  function updateLayoutClasses() {
    const wrapper = document.getElementById("tei-wrapper");
    const columns = wrapper.querySelectorAll(".tei-column");
    const visibleCols = Array.from(columns).filter(col => col.offsetParent !== null).length;
    wrapper.classList.remove("single-view", "dual-view", "synoptic-view");
    if (visibleCols === 1) wrapper.classList.add("single-view");
    else if (visibleCols === 2) wrapper.classList.add("dual-view");
    else wrapper.classList.add("synoptic-view");
  }

  function renderFinalAuthorialRdg(rdg) {
    const clone = rdg.cloneNode(true);

    // Remove all <del> elements
    clone.querySelectorAll("tei-del").forEach(del => del.remove());

    // Flatten <add> content into main content (unwrap if needed)
    clone.querySelectorAll("tei-add").forEach(add => {
      const span = document.createElement("span");
      span.innerHTML = add.innerHTML;
      add.replaceWith(span);
    });

    // Replace rdg's content with the cleaned version
    rdg.innerHTML = clone.innerHTML;
  }

  const phaseHierarchy = {
    "A0": ["A0"],
    "A1": ["A1", "A2"],
    "A2": ["A1", "A2"],
    "B": ["A1", "A2", "B"]
  };


  function decorateRdgWithHighlight(rdg) {
  if (rdg.classList.contains("decorated")) return;

  const wit = rdg.getAttribute("wit") || "unknown";
  const seq = rdg.getAttribute("varSeq") || "";

  rdg.classList.add(`wit-${wit}`);
  rdg.classList.add("decorated");

  if (seq && !rdg.querySelector(".rdg-seq")) {
    const sup = document.createElement("sup");
    sup.className = "rdg-seq";
    sup.textContent = seq;
    rdg.appendChild(sup);
  }

  const subst = rdg.querySelector("tei-subst");
  if (subst) {
    const del = subst.querySelector("tei-del");
    const add = subst.querySelector("tei-add");

    if (del) del.outerHTML = `<span class="deletion">${del.innerHTML}</span>`;
    if (add) add.outerHTML = `<span class="addition">${add.innerHTML}</span>`;
  }
}


function filterReadings({ wit = null, showAll = false, defaultView = false }) {
  const apps = document.querySelectorAll("tei-app");

  apps.forEach(app => {
    const rdgs = Array.from(app.querySelectorAll("tei-rdg, tei-lem"));
    let bestRdg = null;
    let highestSeq = -1;

    rdgs.forEach(rdg => {
      const seq = parseInt(rdg.getAttribute("varSeq"), 10);
      if (!isNaN(seq) && seq > highestSeq) {
        highestSeq = seq;
        bestRdg = rdg;
      }
    });

    // Reset all rdgs first
    if (!showAll && !defaultView) {
      rdgs.forEach(rdg => {
        rdg.style.display = "none";
        rdg.classList.remove("active-reading", "wit-A0", "wit-A1", "wit-A2", "wit-B1", "wit-B2", "decorated");
        if (rdg.dataset.originalHtml) rdg.innerHTML = rdg.dataset.originalHtml;

        const existingSup = rdg.querySelector(".rdg-seq");
        if (existingSup) existingSup.remove();
      });
    }

    if (wit) {
      let found = false;
      let exactMatchFound = false;
      const allowedWits = phaseHierarchy[wit] || [wit];

      rdgs.forEach(rdg => {
        const rdgWit = rdg.getAttribute("wit");
        if (allowedWits.includes(rdgWit)) {
          rdg.style.display = "inline";
          found = true;
        }

        if (rdgWit === wit) {
          decorateRdgWithHighlight(rdg);
          rdg.classList.add("active-reading");
          exactMatchFound = true;
        }
      });

      app.style.display = found ? "inline" : "none";
      return;
    }

    if (showAll || defaultView) {
      rdgs.forEach(rdg => {
        decorateRdgWithHighlight(rdg);
        rdg.style.display = "inline";
      });
      app.style.display = "inline";
      return;
    }
  });
}
    
  function handleVariantChange(value) {
    document.body.classList.remove("clean-mode");
    restoreAllReadings(); // ← full restoration
    if (value === "all") {
      filterReadings({ showAll: true });
    } else if (["A0", "A1", "A2", "B"].includes(value)) {
      filterReadings({ wit: value });
    }
  }


  function showCleanLemmasOnly() {
    const apps = document.querySelectorAll("tei-app");

    apps.forEach(app => {
      const rdgs = app.querySelectorAll("tei-rdg");
      const lems = app.querySelectorAll("tei-lem");

      // Hide all readings
      rdgs.forEach(rdg => {
        rdg.style.display = "none";
      });

      // Show and clean all lemmas
      lems.forEach(lem => {
        if (!lem.dataset.originalHtml) {
          lem.dataset.originalHtml = lem.innerHTML;
        }
        lem.style.display = "inline";
        lem.classList.remove("decorated", "active-reading");
        lem.className = "";

        Array.from(lem.classList).forEach(cls => {
          if (cls.startsWith("wit-")) lem.classList.remove(cls);
        });

        const sup = lem.querySelector(".rdg-seq");
        if (sup) sup.remove();

        // Remove <del> and unwrap <add>
        lem.querySelectorAll("tei-del").forEach(del => del.remove());
        lem.querySelectorAll("tei-add").forEach(add => {
          const span = document.createElement("span");
          span.innerHTML = add.innerHTML;
          add.replaceWith(span);
        });
      });

      // ✅ Hide all note icons (red dots)
      document.querySelectorAll("tei-note.note-decorated").forEach(note => {
        note.style.display="none";  
      });

      app.style.display = "inline";
    });
  }

  function restoreAllReadings() {
    document.querySelectorAll("tei-rdg, tei-lem").forEach(el => {
      if (el.dataset.originalHtml) {
        el.innerHTML = el.dataset.originalHtml;
      }
      el.style.display = ""; // reset display
      el.classList.remove("active-reading", "decorated");
      Array.from(el.classList).forEach(cls => {
        if (cls.startsWith("wit-")) el.classList.remove(cls);
      });
    });

    // Restore notes (if they were removed)
    document.querySelectorAll("tei-note.note-decorated").forEach(note => {
      note.style.display = "inline";
    });
  }

  window.onload = function () {
    const pbSelector = document.getElementById("pb-selector");
    let diplomaticLoaded = false;
    let modernLoaded = false;

    function scrollToPb(id) {
      const containers = [
        document.querySelector("#modern-container .tei-column-scroll"),
        document.querySelector("#diplomatic-container .tei-column-scroll")
      ];

      containers.forEach(container => {
        const target = container?.querySelector(`#${id}`);
        if (target && container) {
          // Scroll so that the target is aligned at the same height
          const scrollY = target.offsetTop - 40;
          container.scrollTo({
            top: scrollY,
            behavior: "smooth"
          });
        }
      });

      // Update facsimile
      const option = pbSelector.querySelector(`option[value="${id}"]`);
      if (option) {
        const facs = option.dataset.facs;
        const img = document.getElementById("facsimile-image");
        img.src = `../facs/${facs}.jpg`;
        img.onerror = () => {
          img.src = "../facs/placeholder.jpg";
        };
      }
    }


    function checkReadyAndInit() {
      if (diplomaticLoaded && modernLoaded) {
        // Attach change listener only after both are loaded
        pbSelector.addEventListener("change", (e) => {
          const id = e.target.value;
          scrollToPb(id);
        });

        // Scroll to first option once
        const firstOption = pbSelector.options[0];
        if (firstOption) {
          pbSelector.value = firstOption.value;
          scrollToPb(firstOption.value);
        }
      }
    }


   function loadTEI(filename, containerId, prefix, onComplete) {
    CETEIcean.getHTML5(filename, data => {
      // 🔧 Restore notes decoration and events
      decorateNotes(data);
      attachNoteEvents(data);

      const container = document.querySelector(`#${containerId} .tei-column-scroll`);
      container.appendChild(data);

      const pbs = data.querySelectorAll("tei-pb");
      pbs.forEach((pb, i) => {
        const id = pb.getAttribute("xml:id") || `pb-${i + 1}`;
        const n = pb.getAttribute("n") || `Página ${i + 1}`;
        const facsName = n.replace(/\[|\]/g, "").replace(/Fol\.?\s*/i, "fol").replace(/\s/g, "").toLowerCase();
        pb.setAttribute("id", id);

        if (!Array.from(pbSelector.options).some(o => o.value === id)) {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = n;
          opt.dataset.facs = facsName;
          pbSelector.appendChild(opt);
        }
      });

      onComplete(); // Only call this after decoration + insertion
    });
  }


    // Load both TEI files
    loadTEI("amor_pleyto_y_desafio_diplomatic.xml", "diplomatic-container", "pb-d", () => {
      diplomaticLoaded = true;
      checkReadyAndInit();
    });

    loadTEI("amor_pleito_y_desafío_modern.xml", "modern-container", "pb-m", () => {
      modernLoaded = true;
      checkReadyAndInit();

      // Decorate readings after modern loads
      setTimeout(() => {
        filterReadings({ showAll: true });
        document.getElementById("variant-selector").value = "all";
      }, 100);
    });

    // Navigation buttons
    document.getElementById("prev-folio").addEventListener("click", () => {
      if (pbSelector.selectedIndex > 0) {
        pbSelector.selectedIndex--;
        pbSelector.dispatchEvent(new Event("change"));
      }
    });

    document.getElementById("next-folio").addEventListener("click", () => {
      if (pbSelector.selectedIndex < pbSelector.options.length - 1) {
        pbSelector.selectedIndex++;
        pbSelector.dispatchEvent(new Event("change"));
      }
    });

    // Variant selector
    document.getElementById("variant-selector").addEventListener("change", function () {
      handleVariantChange(this.value);
    });

    // Clean text button
    document.getElementById("clean-text-button").addEventListener("click", () => {
      document.body.classList.add("clean-mode");
      showCleanLemmasOnly();
      document.getElementById("variant-selector").value = "";
    });

    // Facsimile zoom + drag
    const img = document.getElementById("facsimile-image");
    const wrapper = document.getElementById("facsimile-wrapper");
    let isZoomed = false, isDragging = false, startX, startY, currentX = 0, currentY = 0;

    img.addEventListener("click", () => {
      isZoomed = !isZoomed;
      if (!isZoomed) {
        currentX = currentY = 0;
        img.style.transform = "translate(0px, 0px) scale(1)";
        wrapper.style.cursor = "grab";
      } else {
        img.style.transform = "translate(0px, 0px) scale(2.5)";
        wrapper.style.cursor = "grab";
      }
    });

    wrapper.addEventListener("mousedown", (e) => {
      if (!isZoomed) return;
      isDragging = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      wrapper.style.cursor = "grabbing";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isZoomed || !isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      img.style.transform = `translate(${currentX}px, ${currentY}px) scale(2.5)`;
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      if (isZoomed) wrapper.style.cursor = "grab";
    });4

    let searchResults = [];
    let currentResultIndex = 0;

    function clearHighlights(container) {
      const highlights = container.querySelectorAll(".search-highlight");
      highlights.forEach(span => {
        const parent = span.parentNode;
        parent.replaceChild(document.createTextNode(span.textContent), span);
        parent.normalize(); // Merge adjacent text nodes
      });
    }

    function highlightText(container, query, results = []) {
      clearHighlights(container);
      if (!query) return [];

      const regex = new RegExp(query, "gi");

      container.querySelectorAll("*:not(script):not(style)").forEach(node => {
        node.childNodes.forEach(child => {
          if (child.nodeType === 3 && regex.test(child.textContent)) {
            const span = document.createElement("span");
            span.className = "search-highlight";
            span.textContent = child.textContent.match(regex)[0];

            const split = child.textContent.split(regex);
            const fragments = [];

            for (let i = 0; i < split.length; i++) {
              fragments.push(document.createTextNode(split[i]));
              if (i < split.length - 1) {
                const newSpan = span.cloneNode(true);
                fragments.push(newSpan);
                results.push(newSpan); // Track match
              }
            }

            const parent = child.parentNode;
            fragments.forEach(f => parent.insertBefore(f, child));
            parent.removeChild(child);
          }
        });
      });

      return results;
    }


    document.getElementById("search-button").addEventListener("click", () => {
      const query = document.getElementById("search-input").value.trim();
      const modern = document.querySelector("#modern-container .tei-column-scroll");
      const diplomatic = document.querySelector("#diplomatic-container .tei-column-scroll");

      searchResults = [
        ...highlightText(modern, query),
        ...highlightText(diplomatic, query)
      ];
      currentResultIndex = 0;

      scrollToMatch(currentResultIndex);
    });

    function scrollToMatch(index) {
      if (!searchResults.length) return;

      // Remove all previous highlights
      searchResults.forEach(el => el.classList.remove("active-match"));

      // Activate current match
      const match = searchResults[index];
      match.classList.add("active-match");

      const scrollable = match.closest('.tei-column-scroll');
      if (!scrollable) return;

      // Calculate correct position relative to container
      const matchTop = match.offsetTop;
      scrollable.scrollTo({
        top: matchTop - 40,
        behavior: "smooth"
      });

      // Also scroll page if needed (e.g. sticky header covering it)
      const rect = match.getBoundingClientRect();
      if (rect.top < 100 || rect.bottom > window.innerHeight) {
        match.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }


    document.getElementById("next-match").addEventListener("click", () => {
      if (searchResults.length === 0) return;
      currentResultIndex = (currentResultIndex + 1) % searchResults.length;
      scrollToMatch(currentResultIndex);
    });

    document.getElementById("prev-match").addEventListener("click", () => {
      if (searchResults.length === 0) return;
      currentResultIndex = (currentResultIndex - 1 + searchResults.length) % searchResults.length;
      scrollToMatch(currentResultIndex);
    });

  };
  
</script>

</body>
</html>
