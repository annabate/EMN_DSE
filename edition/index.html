<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El marqués de las Navas - edición genética digital</title>
  <link rel="stylesheet" href="../css/tei.css">
  <script src="../js/CETEI.js"></script>
  <style>
    .hidden { display: none; }
    .zoomed { transform: scale(2); z-index: 1000; position: relative; }
    /* Added styles for notes panel */
    .note-item { position: relative; border: 1px solid #ccc; margin: 0.5em 0; padding: 0.5em; padding-right: 2em; background: #fff; }
    .close-note { position: absolute; top: 5px; right: 5px; cursor: pointer; font-weight: bold; }
    #close-all-notes { cursor: pointer; font-size: 1.2em; }
  </style>
</head>
<body>

  <div id="view-selector">
    <button onclick="toggleView('facsimile-container')">Facsímil</button>
    <button onclick="toggleView('modern-container')">Edición crítico-genética</button>
    <button onclick="toggleView('diplomatic-container')">Transcripción diplomática</button>
  </div>

  <div id="page-jump">
    <label for="pb-selector">Ir a folio:</label>
    <select id="pb-selector"></select>
    <div id="font-size-controls" style="margin-left: 75em;" title="Ajustar fuente de texto">
        <button onclick="adjustFontSize(-1)" style="font-family:Georgia, 'Times New Roman', Times, serif">A−</button>
        <button onclick="adjustFontSize(1)" style="font-family: Georgia, 'Times New Roman', Times, serif;">A+</button>
    </div>
  </div>  

  <div id="tei-wrapper" class="synoptic-view">
    <div id="facsimile-container" class="tei-column sticky"> 
    <div id="folio-controls">
      <button id="prev-folio">🢦</button>
      <button id="next-folio">🢧</button>
    </div> 
      <div id="facsimile-wrapper"><img id="facsimile-image" src="" alt="Facsímil" />    
  </div>
</div>
    <div id="modern-container" class="tei-column">
      <div id="font-size-controls" style="margin-bottom: 1em;" title="Ajustar fuente de texto">
        <button onclick="adjustFontSize(-1)" style="font-family:Georgia, 'Times New Roman' Times, serif">A−</button>
        <button onclick="adjustFontSize(1)" style="font-family: Georgia, 'Times New Roman', Times, serif;">A+</button>
      </div>
    </div>
    <div id="diplomatic-container" class="tei-column">
      <div id="font-size-controls" style="margin-bottom: 1em;" title="Ajustar fuente de texto">
        <button onclick="adjustFontSize(-1)" style="font-family:Georgia, 'Times New Roman', Times, serif">A−</button>
        <button onclick="adjustFontSize(1)" style="font-family: Georgia, 'Times New Roman', Times, serif;">A+</button>
      </div>
    </div>
    <div id="note-container" class="tei-column hidden">
      <div id="close-all-notes-container" style="text-align: right;">
        <span id="close-all-notes" style="cursor: pointer; font-size: 1.2em;">✖️</span>
      </div>
    </div>
  </div>  
 
<script>
  const CETEIcean = new CETEI();

  CETEIcean.addBehaviors({
    "tei": {
      "rdg": variantHandler,
      "lem": variantHandler
    }
  });

  let currentFontSize = 100; // % base

  function adjustFontSize(change) {
    currentFontSize = Math.max(60, Math.min(160, currentFontSize + change * 10)); // limits between 60% and 160%
    document.documentElement.style.setProperty('--user-font-size', `${currentFontSize}%`);
  }


  function variantHandler(el) {
    let span = document.createElement("span");
    span.innerHTML = el.innerHTML;
    span.setAttribute("data-wr-seq", el.getAttribute("data-wr-seq") || "");
    span.setAttribute("wit", el.getAttribute("wit") || "LEM"); // Or keep it empty or "lem"
    span.setAttribute("data-authorial", el.getAttribute("data-authorial") || "");
    span.dataset.originalHtml = el.innerHTML;
    return span;
  }

  function getMaxSeq() {
    let max = -1;
    const allVariants = document.querySelectorAll("tei-rdg[data-authorial='true'], tei-lem[data-authorial='true']");
    allVariants.forEach(rdg => {
      const seq = parseInt(rdg.getAttribute("data-wr-seq"), 10);
      if (!isNaN(seq) && seq > max) max = seq;
    });
    return max;
  }

  const variantSelector = document.getElementById("variant-selector");
  let lastWit = null;

  if (variantSelector) {
    variantSelector.value = "all";
    filterReadings({ showAll: true });
  }

  function toggleView(id) {
    const element = document.getElementById(id);
    element.classList.toggle("hidden");
    updateLayoutClasses();
  }

  function decorateNotes(data) {
    const notes = data.querySelectorAll("tei-note");
    notes.forEach(originalNote => {
      const content = originalNote.cloneNode(true).textContent.trim();
      const cleanNote = document.createElement("tei-note");
      cleanNote.setAttribute("data-note", content);
      cleanNote.classList.add("note-decorated");

      const span = document.createElement("span");
      span.className = "note-icon";
      span.textContent = "💬";
      span.style.cursor = "pointer";
      cleanNote.appendChild(span);
      originalNote.replaceWith(cleanNote);
    });
  }

 function attachNoteEvents(container = document) {
    const notes = container.querySelectorAll("tei-note");
    notes.forEach(note => {
      const content = note.getAttribute("data-note");

      note.addEventListener("click", (e) => {
        e.stopPropagation();

        // Remove existing floating notes
        document.querySelectorAll(".floating-note").forEach(n => n.remove());

        const rect = e.target.getBoundingClientRect();
        const floating = document.createElement("div");
        floating.className = "floating-note";
        floating.innerHTML = `
          <div>${content}</div>
          <button class="pin-note">📌 Fijar</button>
        `;

        document.body.appendChild(floating);
        floating.style.left = `${rect.right + 10 + window.scrollX}px`;
        floating.style.top = `${rect.top + window.scrollY}px`;

        floating.querySelector(".pin-note").addEventListener("click", () => {
          const noteContainer = document.getElementById("note-container");
          noteContainer.classList.remove("hidden");

          const noteItem = document.createElement("div");
          noteItem.className = "note-item";
          noteItem.textContent = content;

          const closeBtn = document.createElement("span");
          closeBtn.className = "close-note";
          closeBtn.textContent = "✖️";
          closeBtn.addEventListener("click", () => {
            noteItem.remove();
            if (!noteContainer.querySelector(".note-item")) {
              noteContainer.classList.add("hidden");
            }
          });

          noteItem.appendChild(closeBtn);
          noteContainer.appendChild(noteItem);

          floating.remove(); // remove the floating version
        });
      });
    });

    // Close floating note on click elsewhere
    document.addEventListener("click", () => {
      document.querySelectorAll(".floating-note").forEach(n => n.remove());
    });
  }


  function updateLayoutClasses() {
    const wrapper = document.getElementById("tei-wrapper");
    const columns = wrapper.querySelectorAll(".tei-column");
    const visibleCols = Array.from(columns).filter(col => col.offsetParent !== null).length;
    wrapper.classList.remove("single-view", "dual-view", "synoptic-view");
    if (visibleCols === 1) wrapper.classList.add("single-view");
    else if (visibleCols === 2) wrapper.classList.add("dual-view");
    else wrapper.classList.add("synoptic-view");
  }

  function renderFinalAuthorialRdg(rdg) {
    const clone = rdg.cloneNode(true);

    // Remove all <del> elements
    clone.querySelectorAll("tei-del").forEach(del => del.remove());

    // Flatten <add> content into main content (unwrap if needed)
    clone.querySelectorAll("tei-add").forEach(add => {
      const span = document.createElement("span");
      span.innerHTML = add.innerHTML;
      add.replaceWith(span);
    });

    // Replace rdg's content with the cleaned version
    rdg.innerHTML = clone.innerHTML;
  }

  const phaseHierarchy = {
    "A0": ["A0"],
    "A1": ["A1", "A2"],
    "A2": ["A1", "A2"],
    "B": ["A1", "A2", "B"]
  };


  function decorateRdgWithHighlight(rdg) {
  if (rdg.classList.contains("decorated")) return;

  const wit = rdg.getAttribute("wit") || "unknown";
  const seq = rdg.getAttribute("data-wr-seq") || "";

  rdg.classList.add(`wit-${wit}`);
  rdg.classList.add("decorated");

  if (seq && !rdg.querySelector(".rdg-seq")) {
    const sup = document.createElement("sup");
    sup.className = "rdg-seq";
    sup.textContent = seq;
    rdg.appendChild(sup);
  }

  const subst = rdg.querySelector("tei-subst");
  if (subst) {
    const del = subst.querySelector("tei-del");
    const add = subst.querySelector("tei-add");

    if (del) del.outerHTML = `<span class="deletion">${del.innerHTML}</span>`;
    if (add) add.outerHTML = `<span class="addition">${add.innerHTML}</span>`;
  }
}


function filterReadings({ wit = null, showAll = false, defaultView = false }) {
  const apps = document.querySelectorAll("tei-app");

  apps.forEach(app => {
    const rdgs = Array.from(app.querySelectorAll("tei-rdg, tei-lem"));
    let bestRdg = null;
    let highestSeq = -1;

    rdgs.forEach(rdg => {
      const seq = parseInt(rdg.getAttribute("data-wr-seq"), 10);
      if (!isNaN(seq) && seq > highestSeq) {
        highestSeq = seq;
        bestRdg = rdg;
      }
    });

    // Reset all rdgs first
    if (!showAll && !defaultView) {
      rdgs.forEach(rdg => {
        rdg.style.display = "none";
        rdg.classList.remove("active-reading", "wit-A0", "wit-A1", "wit-A2", "wit-B1", "wit-B2", "decorated");
        if (rdg.dataset.originalHtml) rdg.innerHTML = rdg.dataset.originalHtml;

        const existingSup = rdg.querySelector(".rdg-seq");
        if (existingSup) existingSup.remove();
      });
    }

    if (wit) {
      let found = false;
      let exactMatchFound = false;
      const allowedWits = phaseHierarchy[wit] || [wit];

      rdgs.forEach(rdg => {
        const rdgWit = rdg.getAttribute("wit");
        if (allowedWits.includes(rdgWit)) {
          rdg.style.display = "inline";
          found = true;
        }

        if (rdgWit === wit) {
          decorateRdgWithHighlight(rdg);
          rdg.classList.add("active-reading");
          exactMatchFound = true;
        }
      });

      app.style.display = found ? "inline" : "none";
      return;
    }

    if (showAll || defaultView) {
      rdgs.forEach(rdg => {
        decorateRdgWithHighlight(rdg);
        rdg.style.display = "inline";
      });
      app.style.display = "inline";
      return;
    }
  });
}
    
  function handleVariantChange(value) {
    document.body.classList.remove("clean-mode");
    restoreAllReadings(); // ← full restoration
    if (value === "all") {
      filterReadings({ showAll: true });
    } else if (["A0", "A1", "A2", "B"].includes(value)) {
      filterReadings({ wit: value });
    }
  }


  function showCleanLemmasOnly() {
    const apps = document.querySelectorAll("tei-app");

    apps.forEach(app => {
      const rdgs = app.querySelectorAll("tei-rdg");
      const lems = app.querySelectorAll("tei-lem");

      // Hide all readings
      rdgs.forEach(rdg => {
        rdg.style.display = "none";
      });

      // Show and clean all lemmas
      lems.forEach(lem => {
        if (!lem.dataset.originalHtml) {
          lem.dataset.originalHtml = lem.innerHTML;
        }
        lem.style.display = "inline";
        lem.classList.remove("decorated", "active-reading");
        lem.className = "";

        Array.from(lem.classList).forEach(cls => {
          if (cls.startsWith("wit-")) lem.classList.remove(cls);
        });

        const sup = lem.querySelector(".rdg-seq");
        if (sup) sup.remove();

        // Remove <del> and unwrap <add>
        lem.querySelectorAll("tei-del").forEach(del => del.remove());
        lem.querySelectorAll("tei-add").forEach(add => {
          const span = document.createElement("span");
          span.innerHTML = add.innerHTML;
          add.replaceWith(span);
        });
      });

      // ✅ Hide all note icons (red dots)
      document.querySelectorAll("tei-note.note-decorated").forEach(note => {
        note.style.display="none";  
      });

      app.style.display = "inline";
    });

    // ✅ Also hide the floating notes panel
    const noteContainer = document.getElementById("note-container");
    if (noteContainer) {
      noteContainer.querySelectorAll(".note-item").forEach(item => item.remove());
      noteContainer.classList.add("hidden");
    }
  }

  function restoreAllReadings() {
    document.querySelectorAll("tei-rdg, tei-lem").forEach(el => {
      if (el.dataset.originalHtml) {
        el.innerHTML = el.dataset.originalHtml;
      }
      el.style.display = ""; // reset display
      el.classList.remove("active-reading", "decorated");
      Array.from(el.classList).forEach(cls => {
        if (cls.startsWith("wit-")) el.classList.remove(cls);
      });
    });

    // Restore notes (if they were removed)
    document.querySelectorAll("tei-note.note-decorated").forEach(note => {
      note.style.display = "inline";
    });
  }


  document.addEventListener("DOMContentLoaded", () => {
    const controlPanel = document.createElement("div");
    controlPanel.id = "variant-controls";
    controlPanel.style.margin = "1em 0";
    controlPanel.style.textAlign = "center";

    controlPanel.innerHTML = `
      <label for="variant-selector" style="font-weight: bold; font-family: Garamond, serif; font-size: 18px; margin-right: 0.5em;">Filtrar intervenciones por tipología:</label>
      <select id="variant-selector"
        style="padding: 0.5em 1em; border-radius: 6px; font-size: 1rem; border: 1px solid #aaa;">
        <option value="all">Mostrar todas</option>
        <option value="A0">Tipo A0 (original)</option>
        <option value="A1">Tipo A1 (correcciones inmediatas)</option>
        <option value="A2">Tipo A2 (revisión posterior)</option>
        <option value="B">Tipo B (intervención de mano ajena)</option>
      </select>
      <button id="clean-text-button" style="margin-left: 1em; font-family: Garamond, serif; font-size: 18px;">
        Mostrar texto limpio
      </button>`
      ;

    document.body.insertBefore(controlPanel, document.getElementById("view-selector"));

    // ✅ Add the JS event listener
    document.getElementById("variant-selector").addEventListener("change", function () {
      handleVariantChange(this.value);
    });

    updateLayoutClasses();
  });

  window.onload = function () {
    CETEIcean.getHTML5("amor_pleyto_y_desafio_diplomatic.xml", function (data) {
      decorateNotes(data);
      attachNoteEvents(data);
      data.querySelectorAll("tei-l").forEach(verse => {
        const prev = verse.previousElementSibling;
        if (prev && prev.tagName === "TEI-PB") verse.parentNode.insertBefore(prev, verse);
      });

      const pbSelector = document.getElementById("pb-selector");
      const pbElements = data.querySelectorAll("tei-pb");
      pbElements.forEach((pb, i) => {
        const id = pb.getAttribute("xml:id") || `pb-${i + 1}`;
        const n = pb.getAttribute("n") || `Pagina ${i + 1}`;
        const facsName = n.replace(/\[|\]/g, "").replace(/Fol\.?\s*/i, "fol").replace(/\s/g, "").toLowerCase();
        pb.setAttribute("id", id);
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = n;
        opt.dataset.facs = facsName;
        pbSelector.appendChild(opt);
      });

      document.getElementById("diplomatic-container").appendChild(data);

      // Folio selector change
      pbSelector.addEventListener("change", e => {
        const option = e.target.selectedOptions[0];
        const facs = option.dataset.facs;
        const id = option.value;
        const target = document.getElementById(id);
        if (target) {
          const yOffset = -60;
          const y = target.getBoundingClientRect().top + window.pageYOffset + yOffset;
          window.scrollTo({ top: y, behavior: "smooth" });
        }
        const img = document.getElementById("facsimile-image");
        img.src = "../facs/" + facs + ".jpg";
        img.onerror = () => {
          img.src = "../facs/placeholder.jpg";
        };
      });

      // Folio init
      const firstOption = pbSelector.options[0];
      if (firstOption) {
        const facs = firstOption.dataset.facs;
        const img = document.getElementById("facsimile-image");
        img.src = "../facs/" + facs + ".jpg";
        img.onerror = () => {
          img.src = "../facs/placeholder.jpg";
        };
      }

      // Folio navigation
      document.getElementById("prev-folio").addEventListener("click", () => {
        if (pbSelector.selectedIndex > 0) {
          pbSelector.selectedIndex--;
          pbSelector.dispatchEvent(new Event("change"));
        }
      });
      document.getElementById("next-folio").addEventListener("click", () => {
        if (pbSelector.selectedIndex < pbSelector.options.length - 1) {
          pbSelector.selectedIndex++;
          pbSelector.dispatchEvent(new Event("change"));
        }
      });

      window.addEventListener("scroll", () => {
        const pbs = document.querySelectorAll("tei-pb");
        const pbSelector = document.getElementById("pb-selector");

        let closestPb = null;
        let closestDistance = Infinity;

        pbs.forEach(pb => {
          const rect = pb.getBoundingClientRect();
          const distance = Math.abs(rect.top - 100); // Offset tweakable

          if (distance < closestDistance) {
            closestDistance = distance;
            closestPb = pb;
          }
        });

        if (closestPb) {
          const matchingOption = Array.from(pbSelector.options).find(opt => opt.value === closestPb.id);
          if (matchingOption && pbSelector.value !== matchingOption.value) {
            pbSelector.value = matchingOption.value;
          }
        }
      });

      document.getElementById("close-all-notes").addEventListener("click", () => {
        const noteContainer = document.getElementById("note-container");
        noteContainer.querySelectorAll(".note-item").forEach(item => item.remove());
        noteContainer.classList.add("hidden");
      });
    });

    CETEIcean.getHTML5("amor_pleito_y_desafío_modern.xml", function (data) {
      document.getElementById("modern-container").appendChild(data);
      decorateNotes(data);
      attachNoteEvents(data);

    requestAnimationFrame(() => {
        const allRdgs = data.querySelectorAll("tei-rdg[data-authorial='true'], tei-lem[data-authorial='true']");
        let maxSeq = -1;
        allRdgs.forEach(rdg => {
          const seq = parseInt(rdg.getAttribute("data-wr-seq"), 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        });

      const variantSelector = document.getElementById("variant-selector");
      let lastWit = null;

      // Find the wit corresponding to the maxSeq
      allRdgs.forEach(rdg => {
        const seq = parseInt(rdg.getAttribute("data-wr-seq"), 10);
        const wit = rdg.getAttribute("wit");
        if (!isNaN(seq) && seq === maxSeq && wit) {
          lastWit = wit;
        }
      });

    if (variantSelector) {
      variantSelector.value = "all";
      filterReadings({ showAll: true });  // ✅ Ensures full decoration logic is applied
    }

    setTimeout(() => {
        filterReadings({ showAll: true });
        document.getElementById("variant-selector").value = "all";
      }, 100); // 100–150ms is usually safe
    
    });

  document.getElementById("clean-text-button").addEventListener("click", () => {
    document.body.classList.add("clean-mode");
    showCleanLemmasOnly();
    document.getElementById("variant-selector").value = "";
  });

    const img = document.getElementById("facsimile-image");
    const wrapper = document.getElementById("facsimile-wrapper");
    let isZoomed = false, isDragging = false, startX, startY, currentX = 0, currentY = 0;

    img.addEventListener("click", () => {
      isZoomed = !isZoomed;
      if (!isZoomed) {
        currentX = currentY = 0;
        img.style.transform = "translate(0px, 0px) scale(1)";
        wrapper.style.cursor = "grab";
      } else {
        img.style.transform = "translate(0px, 0px) scale(2.5)";
        wrapper.style.cursor = "grab";
      }
    });

    wrapper.addEventListener("mousedown", (e) => {
      if (!isZoomed) return;
      isDragging = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      wrapper.style.cursor = "grabbing";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isZoomed || !isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      img.style.transform = `translate(${currentX}px, ${currentY}px) scale(2.5)`;
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      if (isZoomed) wrapper.style.cursor = "grab";
    });
    
  });
   }
</script>

</body>
</html>
