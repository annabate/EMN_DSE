<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El marqués de las Navas: Edición genética digital</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Foldit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body.landing {
        font-family: 'Georgia', Georgia, 'Times New Roman', Times, serif;
        background-color: #decfa2e3;
        margin: 0;
        padding: 0;
      }

      .landing-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 2rem;
      }

      .landing-card {
        background-color: #ffffff;
        padding: 3rem 4rem;
        border-radius: 1.5rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 700px;
        width: 100%;
      }

      .landing-card h1 {
        font-size: 1.6rem;
        font-weight: 600;
        color: #3e2f17;
        margin-bottom: 1.5rem;
      }

      .landing-card p {
        font-size: 1.15rem;
        color: #333;
        margin-bottom: 2rem;
      }

      .landing-btn {
        background-color: #b70808;
        color: #fff;
        padding: 0.7rem 1.4rem;
        font-size: 1rem;
        border: none;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 500;
        transition: background-color 0.3s ease;
      }

      .landing-btn:hover {
        background-color: #970101;
      }
    </style>
  </head>

  <body class="landing">
    <main class="landing-wrapper">
      <section class="landing-card">
        <h1><em>El marqués de las Navas</em>: Edición Digital Académica</h1>
        <p>Bienvenidos al entorno digital de la obra de Lope de Vega.</p>
        <a href="{{ site.baseurl }}/home" class="landing-btn">Entrar</a>
      </section>
    </main>
  </body>
</html>
