<!DOCTYPE html>
<html lang="es">
  <head>
    {% include head.html %}

    <!-- Embedded Custom Styles -->
    <style>
      body {
        background-color: #e4d4a4;
        font-family: 'Playfair Display', serif;
        color: #3a2f25;
      }

      h1, h2, h3, h4, h5 {
        color: #4e3629;
      }

      .navbar {
        background-color: #fff !important;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .navbar-brand, .nav-link {
        font-weight: 500;
        color: #3a2f25 !important;
      }

      .nav-link.active, .nav-link:hover {
        text-decoration: underline;
      }

      .btn-primary {
        background-color: #153959;
        border: none;
      }

      .btn-primary:hover {
        background-color: #102c43;
      }

      .btn-secondary {
        background-color: #8b0000;
        color: white;
        border: none;
      }

      .btn-secondary:hover {
        background-color: #5a0000;
      }

      .card-title {
        color: #4e3629;
      }

      .bg-white {
        background-color: #fff !important;
      }

      footer {
        background-color: #f8f9fa;
        color: #3a2f25;
        padding: 1rem 0;
        text-align: center;
        font-size: 0.9rem;
        margin-top: 2rem;
      }
    </style>
  </head>

  <body>
    {% include navbar.html %}

    <main class="container my-5">
      <div class="row g-5">
        <div class="col-md-8" id="contenidotexto">
          {{ content }}
        </div>

        <div class="col-md-4">
          <div class="position-sticky" style="top: 90px">
            <div class="p-4 mb-3 bg-white rounded shadow-sm">
              <h4 class="fst-italic">Créditos</h4>
              <p class="mb-0">
                Edición crítica y filológica creada por: Anna Abate<br />
                Institución coordinadora: Università di Trento
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    {% include footer.html %}

    <script src="{{ site.baseurl }}/assets/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
